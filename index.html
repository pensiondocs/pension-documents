<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pension Documents</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #ffffff;
    color: #000000;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: center;
}

input, select {
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 16px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ccc;
    text-align: left;
}

th {
    background-color: #f2f2f2;
}

a {
    text-decoration: none;
    color: #0066cc;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

.highlight {
    background: yellow;
    font-weight: bold;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    table, thead, tbody, th, td, tr {
        display: block;
    }
    thead {
        display: none;
    }
    td {
        padding-left: 50%;
        position: relative;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
    }
    td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        font-weight: bold;
    }
}
</style>
</head>

<body>

<h2>Pension Documents</h2>

<table id="docTable">
<thead>
<tr>
    <th>Document Name</th>
    <th>PDF</th>
</tr>
</thead>

<tbody>

<tr data-category="NHIS">
    <td data-label="Document Name">NHIS Annexure-3</td>
    <td data-label="PDF">
        <a href="files/NHIS.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="LC">
    <td data-label="Document Name">Life Certificate Format</td>
    <td data-label="PDF">
        <a href="files/LC.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="ALL">
    <td data-label="Document Name">Conversion Format (Full set)</td>
    <td data-label="PDF">
        <a href="files/ALL.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="FSF">
    <td data-label="Document Name">Family Security Fund Format</td>
    <td data-label="PDF">
        <a href="files/FSF.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="LTA">
    <td data-label="Document Name">Life Time Arrears Format</td>
    <td data-label="PDF">
        <a href="files/LTA.pdf" download>📄 PDF</a>
    </td>
</tr>

</tbody>
</table>

<script>

// =======================
// KEYWORD MAP
// =======================
const keywordMap = {
    "NHIS": ["enrollment"],
    "LC": ["life certificate", "life"],
    "ALL": ["conversion"]
};

// =======================
// LEVENSHTEIN DISTANCE
// =======================
function levenshtein(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b[i - 1] === a[j - 1]) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// =======================
// FUZZY MATCH
// =======================
function fuzzyMatch(input, keyword) {
    input = input.toLowerCase();
    keyword = keyword.toLowerCase();

    if (input.includes(keyword)) return true;

    return levenshtein(input, keyword) <= 2;
}

// =======================
// FILTER FUNCTION
// =======================
function filterTable() {
    const search = document.getElementById("search").value.toLowerCase().trim();
    const category = document.getElementById("category").value;
    const rows = document.querySelectorAll("#docTable tbody tr");

    rows.forEach(row => {

        const cell = row.cells[0];
        const originalText = cell.innerText;
        const docName = originalText.toLowerCase();
        const docKey = row.getAttribute("data-key");
        const rowCategory = row.getAttribute("data-category");

        let matchSearch = false;
        let matchCategory = (category === "all" || rowCategory === category);

        if (search === "") {
            matchSearch = true;
        } else {

            // Keyword-based fuzzy match
            if (keywordMap[docKey]) {
                const keywords = keywordMap[docKey];
                for (let keyword of keywords) {
                    if (fuzzyMatch(search, keyword)) {
                        matchSearch = true;
                        break;
                    }
                }
            }

            // Direct name match fallback
            if (!matchSearch && docName.includes(search)) {
                matchSearch = true;
            }
        }

        if (matchSearch && matchCategory) {
            row.style.display = "";

            if (search !== "" && docName.includes(search)) {
                const regex = new RegExp(search, "gi");
                cell.innerHTML = originalText.replace(regex,
                    match => `<span class="highlight">${match}</span>`
                );
            } else {
                cell.innerText = originalText;
            }

        } else {
            row.style.display = "none";
        }
    });
}

</script>

</body>
</html>
