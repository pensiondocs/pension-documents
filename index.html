<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pension Documents</title>

<style>

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 40px 20px;
    color: #2c3e50;
}

h2 {
    text-align: center;
    font-weight: 600;
    font-size: 28px;
    margin-bottom: 35px;
    letter-spacing: 0.5px;
}

#docTable {
    max-width: 850px;
    margin: 0 auto;
    border-collapse: separate;
    border-spacing: 0 12px;
}

thead th {
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7f8c8d;
    padding: 8px 20px;
}

tbody tr {
    background: #ffffff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    border-radius: 8px;
    transition: 0.2s ease;
}

tbody tr:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

td {
    padding: 18px 20px;
    font-size: 15px;
    border: none;
}

td:first-child {
    font-weight: 600;
}

a {
    display: inline-block;
    padding: 8px 16px;
    background: #2c3e50;
    color: #ffffff;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    transition: 0.2s ease;
}

a:hover {
    background: #1a252f;
}

.highlight {
    background: #ffeaa7;
    padding: 2px 4px;
    border-radius: 4px;
}

/* Mobile */
@media (max-width: 600px) {

    body {
        padding: 20px 10px;
    }

    #docTable {
        border-spacing: 0 10px;
    }

    thead {
        display: none;
    }

    tbody tr {
        display: block;
        padding: 15px;
    }

    td {
        display: block;
        padding: 6px 0;
    }

    td:last-child {
        margin-top: 8px;
    }
}

</style>
</head>

<body>

<h2>Pension Documents</h2>

<table id="docTable">
<thead>
<tr>
    <th>Document Name</th>
    <th>PDF</th>
</tr>
</thead>

<tbody>

<tr data-category="NHIS">
    <td data-label="Document Name">NHIS Annexure-3</td>
    <td data-label="PDF">
        <a href="files/NHIS.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="LC">
    <td data-label="Document Name">Life Certificate Format</td>
    <td data-label="PDF">
        <a href="files/LC.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="ALL">
    <td data-label="Document Name">Conversion Format (Full set)</td>
    <td data-label="PDF">
        <a href="files/ALL.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="FSF">
    <td data-label="Document Name">Family Security Fund Format</td>
    <td data-label="PDF">
        <a href="files/FSF.pdf" download>📄 PDF</a>
    </td>
</tr>

<tr data-category="LTA">
    <td data-label="Document Name">Life Time Arrears Format</td>
    <td data-label="PDF">
        <a href="files/LTA.pdf" download>📄 PDF</a>
    </td>
</tr>

</tbody>
</table>

<script>

// =======================
// KEYWORD MAP
// =======================
const keywordMap = {
    "NHIS": ["enrollment"],
    "LC": ["life certificate", "life"],
    "ALL": ["conversion"]
};

// =======================
// LEVENSHTEIN DISTANCE
// =======================
function levenshtein(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b[i - 1] === a[j - 1]) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// =======================
// FUZZY MATCH
// =======================
function fuzzyMatch(input, keyword) {
    input = input.toLowerCase();
    keyword = keyword.toLowerCase();

    if (input.includes(keyword)) return true;

    return levenshtein(input, keyword) <= 2;
}

// =======================
// FILTER FUNCTION
// =======================
function filterTable() {
    const search = document.getElementById("search").value.toLowerCase().trim();
    const category = document.getElementById("category").value;
    const rows = document.querySelectorAll("#docTable tbody tr");

    rows.forEach(row => {

        const cell = row.cells[0];
        const originalText = cell.innerText;
        const docName = originalText.toLowerCase();
        const docKey = row.getAttribute("data-key");
        const rowCategory = row.getAttribute("data-category");

        let matchSearch = false;
        let matchCategory = (category === "all" || rowCategory === category);

        if (search === "") {
            matchSearch = true;
        } else {

            // Keyword-based fuzzy match
            if (keywordMap[docKey]) {
                const keywords = keywordMap[docKey];
                for (let keyword of keywords) {
                    if (fuzzyMatch(search, keyword)) {
                        matchSearch = true;
                        break;
                    }
                }
            }

            // Direct name match fallback
            if (!matchSearch && docName.includes(search)) {
                matchSearch = true;
            }
        }

        if (matchSearch && matchCategory) {
            row.style.display = "";

            if (search !== "" && docName.includes(search)) {
                const regex = new RegExp(search, "gi");
                cell.innerHTML = originalText.replace(regex,
                    match => `<span class="highlight">${match}</span>`
                );
            } else {
                cell.innerText = originalText;
            }

        } else {
            row.style.display = "none";
        }
    });
}

</script>

</body>
</html>
