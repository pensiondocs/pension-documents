<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pension Documents</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #ffffff;
    color: #000000;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ccc;
    text-align: left;
}

th {
    background-color: #f2f2f2;
}

a {
    text-decoration: none;
    color: #0066cc;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    table, thead, tbody, th, td, tr {
        display: block;
    }
    thead {
        display: none;
    }
    td {
        padding-left: 50%;
        position: relative;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
    }
    td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        font-weight: bold;
    }
}
</style>
</head>

<body>

<h2>Pension Documents</h2>

<table>
<thead>
<tr>
    <th>Document Name</th>
    <th>PDF</th>
</tr>
</thead>

</html>
